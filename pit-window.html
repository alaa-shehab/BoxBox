<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pit Window — Williams Racing AI Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --w-blue:    #00A0DC;
    --w-navy:    #003366;
    --w-deep:    #001529;
    --w-darker:  #000d1a;
    --w-white:   #FFFFFF;
    --w-gray:    #8899AA;
    --w-light:   #E8F4FC;
    --w-accent:  #00C8FF;
    --w-dim:     rgba(0,160,220,0.12);
    --w-border:  rgba(0,160,220,0.25);
    --radius:    10px;
    --font-head: 'Barlow Condensed', sans-serif;
    --font-body: 'Barlow', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--w-darker);
    color: var(--w-white);
    font-family: var(--font-body);
    overflow: hidden;
  }

  /* ── NOISE TEXTURE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* ── ANIMATED GRID BACKGROUND ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,160,220,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,160,220,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    animation: gridDrift 20s linear infinite;
  }

  @keyframes gridDrift {
    0%   { transform: translate(0,0); }
    100% { transform: translate(40px, 40px); }
  }

  /* ── MAIN LAYOUT ── */
  .app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-rows: 64px 1fr;
    grid-template-columns: 280px 1fr;
    height: 100vh;
    gap: 0;
  }

  /* ── HEADER ── */
  header {
    grid-column: 1 / -1;
    background: linear-gradient(90deg, var(--w-navy) 0%, var(--w-deep) 60%);
    border-bottom: 2px solid var(--w-blue);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 300px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,160,220,0.08));
    pointer-events: none;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* Williams logo placeholder — drop your official SVG/PNG here */
  .williams-logo {
    width: 48px;
    height: 32px;
    background: var(--w-blue);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--w-white);
    /* REPLACE THIS DIV WITH: <img src="williams-logo.png" height="32"/> */
  }

  .brand-text h1 {
    font-family: var(--font-head);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--w-white);
    line-height: 1;
  }

  .brand-text span {
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--w-blue);
  }

  .header-divider {
    width: 1px;
    height: 32px;
    background: var(--w-border);
    margin: 0 8px;
  }

  .header-sub {
    font-family: var(--font-head);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--w-gray);
  }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .mode-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border: 1px solid var(--w-border);
    border-radius: 20px;
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--w-gray);
    background: var(--w-dim);
    transition: all 0.3s ease;
  }

  .mode-badge.active {
    color: var(--w-blue);
    border-color: var(--w-blue);
    background: rgba(0,160,220,0.15);
  }

  .mode-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--w-gray);
    transition: background 0.3s;
  }

  .mode-badge.active .mode-dot {
    background: var(--w-blue);
    box-shadow: 0 0 6px var(--w-blue);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: linear-gradient(180deg, var(--w-navy) 0%, var(--w-deep) 100%);
    border-right: 1px solid var(--w-border);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
    position: relative;
  }

  .sidebar::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 200px;
    background: linear-gradient(0deg, rgba(0,160,220,0.06), transparent);
    pointer-events: none;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--w-border);
  }

  .sidebar-label {
    font-family: var(--font-head);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--w-blue);
    margin-bottom: 12px;
  }

  /* Driver Cards */
  .driver-card {
    background: var(--w-dim);
    border: 1px solid var(--w-border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s ease;
    cursor: default;
  }

  .driver-card:hover {
    border-color: var(--w-blue);
    background: rgba(0,160,220,0.15);
    transform: translateX(2px);
  }

  /* Driver photo placeholder — replace with official hackathon image */
  .driver-photo {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--w-navy), var(--w-blue));
    border: 1px solid var(--w-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 900;
    color: var(--w-white);
    overflow: hidden;
    flex-shrink: 0;
    /* REPLACE WITH: <img src="albon.png" style="width:44px;height:44px;border-radius:8px;object-fit:cover;"> */
  }

  .driver-info { flex: 1; min-width: 0; }

  .driver-number {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--w-blue);
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .driver-name {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1;
    color: var(--w-white);
  }

  .driver-tag {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--w-gray);
    margin-top: 2px;
  }

  .driver-pos {
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 900;
    color: var(--w-blue);
    line-height: 1;
  }

  /* Prediction box */
  .prediction-box {
    background: var(--w-dim);
    border: 1px solid var(--w-border);
    border-radius: var(--radius);
    padding: 12px;
  }

  .prediction-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 12px;
  }

  .prediction-row .pred-name {
    font-family: var(--font-head);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--w-gray);
  }

  .prediction-row .pred-val {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--w-blue);
    font-weight: 700;
  }

  .prediction-empty {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--w-gray);
    font-style: italic;
    text-align: center;
    padding: 4px 0;
  }

  /* Car image area */
  .car-area {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  /* Williams 2026 car placeholder — replace with official hackathon car image */
  .car-image-placeholder {
    width: 100%;
    height: 100px;
    background: linear-gradient(135deg, rgba(0,51,102,0.8), rgba(0,160,220,0.2));
    border: 1px dashed var(--w-border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    /* REPLACE THIS DIV WITH: <img src="williams-2026-car.png" style="width:100%;object-fit:contain;"/> */
  }

  .car-image-placeholder span {
    font-family: var(--font-head);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--w-border);
  }

  .car-label {
    font-family: var(--font-head);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--w-gray);
    margin-top: 8px;
    text-align: center;
  }

  /* ── MAIN CHAT AREA ── */
  .chat-area {
    display: flex;
    flex-direction: column;
    background: var(--w-darker);
    position: relative;
    overflow: hidden;
  }

  /* Subtle radial glow behind chat */
  .chat-area::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,160,220,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── MESSAGES ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--w-border); border-radius: 2px; }

  /* Message bubbles */
  .msg {
    display: flex;
    gap: 12px;
    max-width: 680px;
    animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
  }

  .msg.ai .msg-avatar {
    background: linear-gradient(135deg, var(--w-navy), var(--w-blue));
    color: var(--w-white);
    border: 1px solid var(--w-border);
  }

  .msg.user .msg-avatar {
    background: rgba(255,255,255,0.1);
    color: var(--w-gray);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .msg-content { flex: 1; }

  .msg-sender {
    font-family: var(--font-head);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--w-gray);
    margin-bottom: 5px;
  }

  .msg.user .msg-sender { text-align: right; color: var(--w-gray); }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 400;
    word-break: break-word;
  }

  .msg.ai .msg-bubble {
    background: linear-gradient(135deg, rgba(0,51,102,0.6), rgba(0,30,60,0.8));
    border: 1px solid var(--w-border);
    color: var(--w-white);
    border-bottom-left-radius: 4px;
  }

  .msg.user .msg-bubble {
    background: linear-gradient(135deg, var(--w-blue), #0088BB);
    color: var(--w-white);
    border-bottom-right-radius: 4px;
  }

  /* Branch tag on AI messages */
  .msg-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--w-blue);
    border: 1px solid var(--w-border);
    border-radius: 3px;
    padding: 1px 5px;
    margin-bottom: 4px;
  }

  /* Typing indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(0,51,102,0.6), rgba(0,30,60,0.8));
    border: 1px solid var(--w-border);
    border-radius: 12px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--w-blue);
    animation: typingBounce 1.2s ease-in-out infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40%           { transform: scale(1);   opacity: 1;   }
  }

  /* ── QUICK ACTIONS ── */
  .quick-actions {
    padding: 12px 24px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .quick-btn {
    padding: 6px 14px;
    border: 1px solid var(--w-border);
    border-radius: 20px;
    background: var(--w-dim);
    color: var(--w-blue);
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .quick-btn:hover {
    background: rgba(0,160,220,0.2);
    border-color: var(--w-blue);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,160,220,0.2);
  }

  .quick-btn:active { transform: translateY(0); }

  /* ── INPUT BAR ── */
  .input-bar {
    padding: 16px 24px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-top: 1px solid var(--w-border);
    background: linear-gradient(0deg, var(--w-deep), transparent);
    position: relative;
  }

  .input-wrap {
    flex: 1;
    position: relative;
  }

  .input-field {
    width: 100%;
    padding: 12px 48px 12px 16px;
    background: rgba(0,51,102,0.4);
    border: 1px solid var(--w-border);
    border-radius: 10px;
    color: var(--w-white);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 400;
    outline: none;
    transition: all 0.2s ease;
  }

  .input-field::placeholder {
    color: rgba(136,153,170,0.6);
    font-style: italic;
  }

  .input-field:focus {
    border-color: var(--w-blue);
    background: rgba(0,51,102,0.6);
    box-shadow: 0 0 0 3px rgba(0,160,220,0.1);
  }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--w-blue), #0088BB);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 16px rgba(0,160,220,0.4);
  }

  .send-btn:active { transform: scale(0.97); }

  .send-btn svg {
    width: 16px; height: 16px;
    fill: white;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0.5;
    animation: fadeIn 0.6s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 0.5; }
  }

  .empty-icon {
    font-size: 40px;
    filter: grayscale(0.5);
  }

  .empty-text {
    font-family: var(--font-head);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--w-gray);
    text-align: center;
  }

  /* ── SCROLLBAR FOR WHOLE PAGE ── */
  * { scrollbar-width: thin; scrollbar-color: var(--w-border) transparent; }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 56px auto 1fr;
    }
    .sidebar {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo-area">
      <!-- REPLACE .williams-logo div with: <img src="williams-logo.png" height="32"/> -->
      <div class="williams-logo">W</div>
      <div class="brand-text">
        <h1>Pit Window</h1>
        <span>Williams Racing Companion</span>
      </div>
    </div>
    <div class="header-divider"></div>
    <span class="header-sub">Race Intelligence</span>
    <div class="header-right">
      <div class="mode-badge" id="modeBadge">
        <div class="mode-dot"></div>
        <span id="modeText">Awaiting Mode</span>
      </div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Drivers -->
    <div class="sidebar-section">
      <div class="sidebar-label">Drivers — 2026</div>

      <div class="driver-card">
        <!-- REPLACE .driver-photo with: <img src="albon.jpg" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;"> -->
        <div class="driver-photo">AA</div>
        <div class="driver-info">
          <div class="driver-number">#23</div>
          <div class="driver-name">Albon</div>
          <div class="driver-tag">Alex Albon</div>
        </div>
        <div class="driver-pos" id="albonPos">—</div>
      </div>

      <div class="driver-card">
        <!-- REPLACE .driver-photo with: <img src="sainz.jpg" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;"> -->
        <div class="driver-photo">CS</div>
        <div class="driver-info">
          <div class="driver-number">#55</div>
          <div class="driver-name">Sainz</div>
          <div class="driver-tag">Carlos Sainz</div>
        </div>
        <div class="driver-pos" id="sainzPos">—</div>
      </div>
    </div>

    <!-- Prediction -->
    <div class="sidebar-section">
      <div class="sidebar-label">Your Prediction</div>
      <div class="prediction-box">
        <div id="predictionContent">
          <p class="prediction-empty">Set during onboarding</p>
        </div>
      </div>
    </div>

    <!-- Car image -->
    <div class="car-area">
      <!-- REPLACE .car-image-placeholder with: <img src="williams-2026-car.png" style="width:100%;object-fit:contain;"/> -->
      <div class="car-image-placeholder">
        <span>FW47</span>
        <span style="font-size:8px; margin-top:2px;">Drop car image here</span>
      </div>
      <p class="car-label">Williams FW47 — 2026</p>
    </div>

  </aside>

  <!-- CHAT -->
  <main class="chat-area">

    <!-- Quick action buttons -->
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('What is an undercut?')">Undercut</button>
      <button class="quick-btn" onclick="quickSend('What is DRS?')">DRS</button>
      <button class="quick-btn" onclick="quickSend('Should Williams pit now?')">Pit Strategy</button>
      <button class="quick-btn" onclick="quickSend('Tell me about Williams history')">History</button>
      <button class="quick-btn" onclick="quickSend('How is my prediction looking?')">My Prediction</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🏎</div>
        <div class="empty-text">Connecting to the pit wall…</div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-bar">
      <div class="input-wrap">
        <input
          class="input-field"
          id="inputField"
          type="text"
          placeholder="Ask about strategy, history, or your prediction…"
          onkeydown="handleKey(event)"
          autocomplete="off"
        />
      </div>
      <button class="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>

  </main>
</div>

<script>
  // ── CONFIG — replace with your actual Airia API details ──────────────────
  const CONFIG = {
    apiEndpoint: 'YOUR_AIRIA_API_ENDPOINT_HERE',
    apiKey:      'YOUR_AIRIA_API_KEY_HERE',
  };

  // ── STATE ─────────────────────────────────────────────────────────────────
  let conversationId  = null;
  let userMode        = null;
  let fanPrediction   = null;
  let isLoading       = false;
  let messageCount    = 0;

  // Branch tag labels for display
  const BRANCH_TAGS = {
    'TERM_EXPLAIN': '⚙ Terms Engine',
    'STRATEGY':     '🏁 Strategy Engine',
    'HISTORY':      '📖 History',
    'PREDICTION':   '🎯 Prediction Tracker',
    'GENERAL':      null,
  };

  // ── INIT ──────────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => startConversation(), 600);
    document.getElementById('inputField').focus();
  });

  async function startConversation() {
    await callAPI('Hello', true);
  }

  // ── SEND ──────────────────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('inputField');
    const text  = input.value.trim();
    if (!text || isLoading) return;
    input.value = '';
    appendMessage('user', text);
    await callAPI(text, false);
  }

  function quickSend(text) {
    if (isLoading) return;
    document.getElementById('inputField').value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── API CALL ──────────────────────────────────────────────────────────────
  async function callAPI(message, silent) {
    isLoading = true;
    const loadingId = showTyping();

    try {
      const res = await fetch(CONFIG.apiEndpoint, {
        method:  'POST',
        headers: {
          'Authorization': `Bearer ${CONFIG.apiKey}`,
          'Content-Type':  'application/json',
        },
        body: JSON.stringify({
          message,
          conversationId: conversationId || undefined,
        }),
      });

      const data = await res.json();
      removeTyping(loadingId);

      if (data.conversationId) conversationId = data.conversationId;

      const reply = data.response || data.result || data.output || 'No response received.';
      const tag   = detectBranch(reply, message);

      appendMessage('ai', reply, tag);
      updateSidebarFromReply(reply, message);

    } catch (err) {
      removeTyping(loadingId);
      appendMessage('ai', '⚠ Connection issue. Check your API configuration in app.js.');
      console.error('API error:', err);
    }

    isLoading = false;
  }

  // ── RENDER ────────────────────────────────────────────────────────────────
  function appendMessage(role, text, tag = null) {
    const container = document.getElementById('messages');

    // Remove empty state on first real message
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    msg.style.animationDelay = `${messageCount * 0.05}s`;
    messageCount++;

    const avatarLabel = role === 'ai' ? 'PW' : 'YOU';

    let tagHTML = '';
    if (tag && BRANCH_TAGS[tag]) {
      tagHTML = `<div class="msg-tag">${BRANCH_TAGS[tag]}</div><br/>`;
    }

    msg.innerHTML = `
      <div class="msg-avatar">${avatarLabel}</div>
      <div class="msg-content">
        <div class="msg-sender">${role === 'ai' ? 'Pit Window' : 'You'}</div>
        <div class="msg-bubble">${tagHTML}${escapeHTML(text)}</div>
      </div>
    `;

    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    const container = document.getElementById('messages');
    const id = 'typing-' + Date.now();
    const wrap = document.createElement('div');
    wrap.className = 'msg ai';
    wrap.id = id;
    wrap.innerHTML = `
      <div class="msg-avatar">PW</div>
      <div class="msg-content">
        <div class="msg-sender">Pit Window</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    `;
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── SIDEBAR UPDATES ───────────────────────────────────────────────────────
  function updateSidebarFromReply(reply, userMsg) {
    const lower = userMsg.toLowerCase();
    const replyL = reply.toLowerCase();

    // Detect and set user mode
    if (!userMode) {
      if (lower.includes('home') || lower.includes('watching') || lower.includes('sofa')) {
        setMode('home');
      } else if (lower.includes('circuit') || lower.includes('track') || lower.includes('there')) {
        setMode('trackside');
      }
    }

    // Detect prediction storage
    if (!fanPrediction && (lower.includes('p') || lower.includes('position'))) {
      const albonMatch = lower.match(/albon\s*[p#]?(\d+)/i) || lower.match(/[p#](\d+).*albon/i);
      const sainzMatch = lower.match(/sainz\s*[p#]?(\d+)/i) || lower.match(/[p#](\d+).*sainz/i);
      if (albonMatch && sainzMatch) {
        fanPrediction = { albon: `P${albonMatch[1]}`, sainz: `P${sainzMatch[1]}` };
        renderPrediction();
      }
    }

    // Parse positions from agent reply (rough heuristic)
    const albonPos = reply.match(/Albon.*?[Pp](\d+)/);
    const sainzPos = reply.match(/Sainz.*?[Pp](\d+)/);
    if (albonPos) document.getElementById('albonPos').textContent = `P${albonPos[1]}`;
    if (sainzPos) document.getElementById('sainzPos').textContent = `P${sainzPos[1]}`;
  }

  function setMode(mode) {
    userMode = mode;
    const badge = document.getElementById('modeBadge');
    const text  = document.getElementById('modeText');
    badge.classList.add('active');
    text.textContent = mode === 'home' ? '🏠 Home Fan' : '🏟 Trackside';
  }

  function renderPrediction() {
    if (!fanPrediction) return;
    const box = document.getElementById('predictionContent');
    box.innerHTML = `
      <div class="prediction-row">
        <span class="pred-name">Albon</span>
        <span class="pred-val">${fanPrediction.albon}</span>
      </div>
      <div class="prediction-row">
        <span class="pred-name">Sainz</span>
        <span class="pred-val">${fanPrediction.sainz}</span>
      </div>
    `;
  }

  // ── HELPERS ───────────────────────────────────────────────────────────────
  function detectBranch(reply, userMsg) {
    const m = userMsg.toLowerCase();
    if (m.includes('undercut') || m.includes('overcut') || m.includes('drs') ||
        m.includes('vsc') || m.includes('graining') || m.includes('delta') ||
        m.includes('what is') || m.includes('explain')) return 'TERM_EXPLAIN';
    if (m.includes('pit') || m.includes('strategy') || m.includes('tyre') ||
        m.includes('tire') || m.includes('should williams')) return 'STRATEGY';
    if (m.includes('history') || m.includes('championship') || m.includes('1992') ||
        m.includes('senna') || m.includes('mansell')) return 'HISTORY';
    if (m.includes('prediction') || m.includes('my guess') || m.includes('how am i')) return 'PREDICTION';
    return 'GENERAL';
  }

  function escapeHTML(str) {
    return str
      .replace(/&/g,  '&amp;')
      .replace(/</g,  '&lt;')
      .replace(/>/g,  '&gt;')
      .replace(/\n/g, '<br/>');
  }
</script>
</body>
</html>
